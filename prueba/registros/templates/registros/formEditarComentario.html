{% extends "inicio/encabezado.html" %}
{% block titulo%} CONTACTANOS {%endblock%}
{% block encabezado%}
<!--Encabezdo -->
<div class="page-header">
<div class="page-title">
<h3>Contactanos
<small>Modificando comentario</small></h3>

</div>

</div>
<!-- /Encabezado-->
{%endblock%}
{% block contenido %}	
<form class="form-horizontal" action="{% url 'Editar' comentario.id%}"method="POST" role="form">
    {%csrf_token%}
    <div class="panel panel-default">
        <div class="panel-body">
            <div class="form-group">            
                <label class="col-sm-2 control-label text-right">Nombre:</label>  
                <input class="col-sm-2 control-input" value={{comentario.usuario}} name="usuario" type="text" class="form-control">                
            </div>
            <div class="form-group">
                <label class="col-sm-2 control-label text-right">Comentario:</label>
                <textarea name="mensaje" cols="50" rows="10" class="col-sm-2 control-label">{{comentario.mensaje}} </textarea>
            </div>
            <div class="form-group">
                <input type="submit" value="Enviar" class="btn btn-primary">
            </div>
        </div>
    </div>
</form>
{%endblock%}
